services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_shanghua_test
    hostname: shanghua-test-docker
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ShangHua@TestPg2026
      TZ: Asia/Shanghai
    volumes:
      - postgres_shanghua_test_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      shanghua_test:
        aliases:
          - shanghua-test-docker

networks:
  shanghua_test:
    name: shanghua_test

volumes:
  postgres_shanghua_test_data:
