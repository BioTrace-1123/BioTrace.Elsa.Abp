services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspaces/BioTrace.Elsa.Abp:cached
      - ${HOME}/.gcm:/home/vscode/.gcm:cached
      - ${SSH_AUTH_SOCK}:/tmp/ssh-agent.sock
    environment:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    ports: !reset []
